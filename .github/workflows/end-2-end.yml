name: End-2-end

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - PHP_VERSION: php83-fpm
            MAGEOS_VERSION: 3.3.0
          - PHP_VERSION: php85-fpm
            MAGEOS_VERSION: 3.4.0
    runs-on: ubuntu-latest
    env:
      PHP_VERSION: ${{ matrix.PHP_VERSION }}
      MAGEOS_VERSION: ${{ matrix.MAGEOS_VERSION }}
      BASE_URL: http://magento.test/
      COMPOSE_FILE: .github/workflows/templates/docker-compose.yml
    steps:
      - uses: actions/checkout@v4

      # WireMock stands in for the provider, so no API key is ever needed.
      - name: Start the containers
        run: |
          docker compose -f $COMPOSE_FILE up -d --quiet-pull
          timeout 90 bash -c 'until docker exec wiremock curl -sf http://localhost:8080/__admin/health > /dev/null; do sleep 2; done'

      # MageOS_AiBase has no tagged release yet, so it comes off its branch under an inline alias
      # that satisfies this module's ^1.0. Drop both lines once it is on Packagist.
      # Its Symfony AI bridges are a `suggest`, which composer never installs on its own, and
      # without one there is no client to call a provider with at all.
      - name: Install the AI base module and a provider bridge
        run: |
          docker exec mage-os-community-edition composer config repositories.mage-os-ai-base vcs https://github.com/mage-os-lab/module-ai-base
          docker exec mage-os-community-edition ./retry "composer require --no-update mage-os/module-ai-base:'dev-main as 1.0.0'"
          docker exec mage-os-community-edition ./retry "composer require --no-update symfony/ai-lm-studio-platform"

      - name: Upload the module into the Mage-OS container
        run: |
          sed -i '/version/d' ./composer.json
          docker cp $(pwd) mage-os-community-edition:/data/extensions/
          docker exec mage-os-community-edition ./install-composer-package mago-assistant/mago:@dev

      - name: Activate the extension
        run: |
          docker exec mage-os-community-edition ./retry "php bin/magento module:enable MageOS_AiBase MagoAssistant_Mago"
          # Two dashboard modals cover the whole admin on first login and swallow every click:
          # the admin usage tracking modal and the release notification banner.
          docker exec mage-os-community-edition ./retry "php bin/magento module:disable Magento_AdminAnalytics Magento_ReleaseNotification"
          docker exec mage-os-community-edition ./retry "php bin/magento setup:upgrade --keep-generated --no-interaction"

      - name: Configure Mage-OS
        run: |
          docker exec mage-os-community-edition /bin/bash ./change-base-url $BASE_URL
          docker exec mage-os-community-edition /bin/bash ./disable-2fa
          docker exec mage-os-community-edition ./retry "bin/magento config:set mago/general/enabled 1"
          # One MageOS_AiBase service row on the LM Studio bridge, whose base URL is a local
          # runtime address by design, so nothing has to be redirected to make this work. It speaks
          # OpenAI chat-completions and appends /v1/chat/completions itself, so the base URL stops
          # at the host. No credential is involved: a local runtime takes none.
          docker exec mage-os-community-edition ./retry "bin/magento config:set mageos_ai/services/configuration '{\"_e2e_row_1\":{\"lmstudio\":{\"base_url\":\"http://wiremock:8080\",\"model\":\"gemma-3-4b-it-qat\"}}}'"
          # Empty means "first usable service", which is the one row above.
          docker exec mage-os-community-edition ./retry "bin/magento config:set mago/api/ai_service ''"
          # The page context specs assert on what the debug log does and does not record.
          docker exec mage-os-community-edition ./retry "bin/magento config:set mago/debug/debug 1"
          # One admin session is shared by every parallel worker.
          docker exec mage-os-community-edition ./retry "bin/magento config:set admin/security/admin_account_sharing 1"
          docker exec mage-os-community-edition ./retry "bin/magento config:set admin/security/session_lifetime 86400"
          docker exec mage-os-community-edition ./retry "bin/magento config:set web/cookie/cookie_lifetime 86400"

      - name: Prepare Mage-OS
        run: |
          sudo echo "127.0.0.1 magento.test" | sudo tee -a /etc/hosts
          # The specs use the same http://wiremock:8080 address Magento does, from the runner host.
          sudo echo "127.0.0.1 wiremock" | sudo tee -a /etc/hosts
          docker exec mage-os-community-edition ./retry "php bin/magento setup:di:compile"
          # The image ships a deployed pub/static. -f only means "deploy in any mode", it does not
          # overwrite, so without this the module's LESS never reaches the theme's styles.css.
          docker exec mage-os-community-edition bash -c "rm -rf pub/static/adminhtml pub/static/deployed_version.txt var/view_preprocessed"
          docker exec mage-os-community-edition ./retry "php bin/magento setup:static-content:deploy -f"
          docker exec mage-os-community-edition ./retry "php bin/magento indexer:reindex"
          docker exec mage-os-community-edition ./retry "php bin/magento cache:flush"

      - name: Check that Mage-OS is reachable
        run: |
          curl --fail-with-body -v -w "%{http_code}" ${BASE_URL}
          curl --fail-with-body -v -w "%{http_code}" ${BASE_URL}admin

      - name: Install Playwright
        run: |
          cd Test/End-2-end
          npm install
          npx playwright install --with-deps chromium

      - name: Run the tests
        env:
          # The container's var/log is mounted at mage-os-logs (see the compose file).
          MAGO_DEBUG_LOG: ${{ github.workspace }}/mage-os-logs/mago-debug.log
        run: |
          cd Test/End-2-end
          FORCE_COLOR=true npx playwright test

      - name: Upload the report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: E2E report - ${{ matrix.PHP_VERSION }} - mage-os ${{ matrix.MAGEOS_VERSION }}
          retention-days: 7
          path: |
            Test/End-2-end/playwright-report
            Test/End-2-end/test-results

      - name: Dump the logs
        if: failure()
        run: |
          docker compose -f $COMPOSE_FILE logs mage-os > mage-os.log
          docker compose -f $COMPOSE_FILE logs wiremock > wiremock.log

      - name: Upload the logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: E2E logs - ${{ matrix.PHP_VERSION }} - mage-os ${{ matrix.MAGEOS_VERSION }}
          retention-days: 7
          path: |
            mage-os-logs
            mage-os.log
            wiremock.log
